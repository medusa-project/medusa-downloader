default: &default
  adapter: postgresql
  encoding: utf8
  # For details on connection pooling, see Rails configuration guide
  # http://guides.rubyonrails.org/configuring.html#database-pooling
  pool: 10

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test: &test
  <<: *default
  database: downloader_test
  username: postgres
  password: postgres
  host: postgres
  port: 5432

development:
  <<: *default
  database: downloader
  username: <%= Rails.env.development? ? Rails.application.credentials[:primary_db][:username] : "username" %>
  password: <%= Rails.env.development? ? Rails.application.credentials[:primary_db][:password] : "password" %>
  host: <%= Rails.env.development? ? Rails.application.credentials[:primary_db][:host] : "host" %>
  port: 5432

production:
  <<: *default
  database: downloader
  username: <%= Rails.env.production? ? Rails.application.credentials[:primary_db][:username] : "username" %>
  password: <%= Rails.env.production? ? Rails.application.credentials[:primary_db][:password] : "password" %>
  host: <%= Rails.env.production? ? Rails.application.credentials[:primary_db][:host] : "host" %>

demo:
  <<: *default
  database: downloader
  username: <%= Rails.env.demo? ? Rails.application.credentials[:primary_db][:username] : "username" %>
  password: <%= Rails.env.demo? ? Rails.application.credentials[:primary_db][:password] : "password" %>
  host: <%= Rails.env.demo? ? Rails.application.credentials[:primary_db][:host] : "host" %>